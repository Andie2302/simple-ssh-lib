[package]
name = "simple-ssh-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20 = "0.10.2"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
poly1305 = "0.9.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "rt", "macros", "net", "time"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"
