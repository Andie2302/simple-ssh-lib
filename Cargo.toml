[package]
name = "simple-ssh-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
bcrypt-pbkdf = "0.11.0"
chacha20 = "0.10.2"
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
poly1305 = "0.9.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "rt", "macros", "net", "time", "sync"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt", "time"] }
