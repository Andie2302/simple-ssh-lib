[package]
name = "simple-ssh-lib-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "time", "io-util", "macros"] }

[dependencies.simple-ssh-lib]
path = ".."

# Eigenes Workspace, damit `cargo build` im Hauptprojekt das Fuzz-Projekt nicht anfasst.
[workspace]

[[bin]]
name = "wire_reader"
path = "fuzz_targets/wire_reader.rs"
test = false
doc = false
bench = false

